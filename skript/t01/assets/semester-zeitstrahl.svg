<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" role="img" aria-labelledby="t d">
  <title id="t">Das Semester: sechs Blocktermine, danach Dokumentation und Video, am Semesterende das Abschlusskolloquium</title>
  <desc id="d">Zeitstrahl mit sechs Blöcken im Wortlaut der Etappentabelle des Aufgabenblatts. Block 1 Kick-off, Teambildung, Problemraum kartieren, gelb markiert als heutiger Termin; darunter das Etappenergebnis Verantwortungsmatrix des Teams und Rohfassung des Interviewleitfadens. Block 2 Interviewhandwerk, Probeinterviews im Raum. Block 3 Beleg-Runde: Ihre Zitate an der Wand; Auswertung; KI-Persona gegen die eigenen Daten prüfen. Block 4 Ideenfindung und Sketching; Team-Retro. Block 5 Wireframing, Testvorbereitung. Block 6 Usability-Tests, Befunde priorisieren. Danach eine gestrichelte Etappe Doku und Video im Selbststudium, am Ende das Abschlusskolloquium.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .b { font-size: 21px; font-weight: 700; }
    .s { font-size: 13px; fill: #5a6472; }
    .sd { font-size: 13px; fill: #031121; }
    .w { fill: #ffffff; }
    .hier { font-size: 16px; font-weight: 700; }
    .cap { font-size: 15px; fill: #5a6472; }
    .erg { font-size: 15px; fill: #031121; }
    .box { fill: #e5effb; }
    .tick { stroke: #c7cdd4; stroke-width: 2; }
  </style>
  <rect width="1400" height="400" fill="#ffffff"/>

  <!-- Baseline -->
  <line class="tick" x1="30" y1="290" x2="1345" y2="290"/>
  <path d="M1345 283 L1361 290 L1345 297 Z" fill="#c7cdd4"/>

  <!-- Sie sind hier -->
  <text class="hier" x="40" y="76">Sie sind hier: Block 1</text>
  <rect x="40" y="86" width="150" height="5" fill="#fcd430"/>

  <!-- Block 1 (heute, Akzent) -->
  <rect x="30" y="112" width="160" height="140" rx="6" fill="#fcd430"/>
  <text class="b" x="40" y="144">Block 1</text>
  <text class="sd" x="40" y="174">Kick-off, Teambildung,</text>
  <text class="sd" x="40" y="194">Problemraum kartieren</text>
  <line class="tick" x1="110" y1="252" x2="110" y2="290"/>

  <!-- Block 2 -->
  <rect class="box" x="202" y="112" width="160" height="140" rx="6"/>
  <text class="b" x="212" y="144">Block 2</text>
  <text class="s" x="212" y="174">Interviewhandwerk,</text>
  <text class="s" x="212" y="194">Probeinterviews im Raum</text>
  <line class="tick" x1="282" y1="252" x2="282" y2="290"/>

  <!-- Block 3 -->
  <rect class="box" x="374" y="112" width="160" height="140" rx="6"/>
  <text class="b" x="384" y="144">Block 3</text>
  <text class="s" x="384" y="174">Beleg-Runde: Ihre Zitate</text>
  <text class="s" x="384" y="194">an der Wand; Auswertung;</text>
  <text class="s" x="384" y="214">KI-Persona gegen die</text>
  <text class="s" x="384" y="234">eigenen Daten prüfen</text>
  <line class="tick" x1="454" y1="252" x2="454" y2="290"/>

  <!-- Block 4 -->
  <rect class="box" x="546" y="112" width="160" height="140" rx="6"/>
  <text class="b" x="556" y="144">Block 4</text>
  <text class="s" x="556" y="174">Ideenfindung und</text>
  <text class="s" x="556" y="194">Sketching; Team-Retro</text>
  <line class="tick" x1="626" y1="252" x2="626" y2="290"/>

  <!-- Block 5 -->
  <rect class="box" x="718" y="112" width="160" height="140" rx="6"/>
  <text class="b" x="728" y="144">Block 5</text>
  <text class="s" x="728" y="174">Wireframing,</text>
  <text class="s" x="728" y="194">Testvorbereitung</text>
  <line class="tick" x1="798" y1="252" x2="798" y2="290"/>

  <!-- Block 6 -->
  <rect class="box" x="890" y="112" width="160" height="140" rx="6"/>
  <text class="b" x="900" y="144">Block 6</text>
  <text class="s" x="900" y="174">Usability-Tests,</text>
  <text class="s" x="900" y="194">Befunde priorisieren</text>
  <line class="tick" x1="970" y1="252" x2="970" y2="290"/>

  <!-- Doku + Video (Selbststudium) -->
  <rect x="1074" y="112" width="132" height="140" rx="6" fill="none" stroke="#5a6472" stroke-width="2" stroke-dasharray="6 6"/>
  <text class="b" x="1084" y="144" style="font-size:18px">Doku + Video</text>
  <text class="s" x="1084" y="174">Selbststudium,</text>
  <text class="s" x="1084" y="194">Print, PDF, Video</text>
  <line class="tick" x1="1140" y1="252" x2="1140" y2="290"/>

  <!-- Abschlusskolloquium -->
  <rect x="1226" y="112" width="144" height="140" rx="6" fill="#1a2f6e"/>
  <text class="b w" x="1236" y="144" style="font-size:18px">Abschluss-</text>
  <text class="b w" x="1236" y="168" style="font-size:18px">kolloquium</text>
  <text class="s w" x="1236" y="196" style="fill:#e5effb">Doku + Video vorführen</text>
  <line class="tick" x1="1298" y1="252" x2="1298" y2="290"/>

  <text class="erg" x="30" y="332">Am Ende von Block 1 liegt vor: Verantwortungsmatrix des Teams, Rohfassung des Interviewleitfadens</text>
  <text class="cap" x="30" y="362">Sechs Blocktermine à 4 Stunden · danach gehört die Zeit der Dokumentation und dem Video · am Semesterende das Abschlusskolloquium</text>
</svg>
